name: lib-publish-snapshot

# Reusable: publica en Nexus la versión -SNAPSHOT actual de una librería sbt (p. ej. `5.0.0-SNAPSHOT`
# desde `main` mientras la mayor no sale), para que los consumidores en migración la tomen.
# No crea tags, commits ni GitHub releases.
#
#   jobs:
#     publish-snapshot:
#       uses: zistemas/ci/.github/workflows/lib-publish-snapshot.yml@v1
#       secrets: inherit

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
      sbt-command:
        description: Comando sbt que testea y publica
        type: string
        default: unitTests publish
    secrets:
      NEXUS_USER:
        required: true
      NEXUS_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Montevideo   # hay tests que dependen de la zona horaria
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Verificar versión SNAPSHOT
        # Una versión final ya publicada no se pisa por acá: eso es trabajo de lib-release.
        run: |
          if ! grep -q -- '-SNAPSHOT' version.sbt; then
            echo "::error::version.sbt no es SNAPSHOT ($(cat version.sbt)). Las versiones finales se publican con lib-release."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt ${{ inputs.sbt-command }}
