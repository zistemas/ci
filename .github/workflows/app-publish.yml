name: app-publish

# Reusable: pre-release de una aplicación sbt (JAR de sbt-assembly) como GitHub release.
# La versión sale de la rama y de los tags existentes; no hay version.sbt que commitear:
#   develop              -> v<NEXT>-snapshot.NNN   NEXT = último tag final vX.Y.Z + bump de .github/next-bump
#   release/vX.Y.Z[...]  -> vX.Y.Z-rc.NNN
#   hotfix/vX.Y.Z[-desc] -> vX.Y.Z-rc.NNN
# El build tiene que tomar la versión de `ThisBuild / version` y nombrar el JAR `<algo>-<versión>.jar`.
#   jobs:
#     publish:
#       uses: zistemas/ci/.github/workflows/app-publish.yml@v1
#       permissions:
#         contents: write
#       secrets:
#         NEXUS_USER: ${{ secrets.NEXUS_USER }}
#         NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
      sbt-command:
        description: Comando sbt que arma el JAR (después de fijar la versión)
        type: string
        default: assembly
    outputs:
      version:
        description: Versión publicada, sin la v
        value: ${{ jobs.publish.outputs.version }}
    secrets:
      NEXUS_USER:
        required: true
      NEXUS_PASSWORD:
        required: true

# Dos pushes seguidos a la misma rama calcularían el mismo NNN.
concurrency:
  group: app-publish-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TZ: America/Montevideo
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Versión
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF" in
            develop)
              last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
              IFS=. read -r ma mi pa <<< "${last:-v0.0.0}"
              ma=${ma#v}
              bump=$(tr -d '[:space:]' < .github/next-bump 2>/dev/null || echo minor)
              case "$bump" in
                major) base="$((ma + 1)).0.0" ;;
                minor) base="$ma.$((mi + 1)).0" ;;
                patch) base="$ma.$mi.$((pa + 1))" ;;
                *) echo "::error::.github/next-bump inválido: '$bump' (major|minor|patch)"; exit 1 ;;
              esac
              tipo=snapshot ;;
            release/v* | hotfix/v*)
              base=$(sed -E 's#^(release|hotfix)/v([0-9]+\.[0-9]+\.[0-9]+).*$#\2#' <<< "$REF")
              [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::la rama no trae versión vX.Y.Z: $REF"; exit 1; }
              tipo=rc ;;
            *)
              echo "::error::rama no publicable: $REF"; exit 1 ;;
          esac
          ultimo=$(git tag -l "v$base-$tipo.*" | sed -E 's/^.*\.([0-9]+)$/\1/' | sort -n | tail -1)
          version=$(printf '%s-%s.%03d' "$base" "$tipo" "$((10#${ultimo:-0} + 1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versión: $version" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build
        run: sbt 'set ThisBuild / version := "${{ steps.version.outputs.version }}"' ${{ inputs.sbt-command }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(target/scala-*/*-"$VERSION".jar)
          [ "${#jars[@]}" -eq 1 ] || { echo "::error::se esperaba un JAR *-$VERSION.jar, hay ${#jars[@]}"; exit 1; }
          gh release create "v$VERSION" "${jars[0]}" --prerelease --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
